CONFIG_PRINTK=y
CONFIG_POLL=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_PCIE=y
CONFIG_PCIE_MSI=y
CONFIG_PCIE_MSI_X=y
CONFIG_PCIE_MSI_MULTI_VECTOR=y

CONFIG_VIRTUALIZATION=y
CONFIG_IVSHMEM=y
CONFIG_IVSHMEM_DOORBELL=y
# DATA, SPACE, STATE, TEST, CTRL (mlink_shm.h)
CONFIG_IVSHMEM_MSI_X_VECTORS=5

# room to map the 4 MiB BAR2 next to the image
CONFIG_KERNEL_VM_SIZE=0x2000000
