# P8.3 IP-stack mode: west build ... -- -DEXTRA_CONF_FILE=net.conf
CONFIG_MLINK_MODEM_NET=y

CONFIG_NETWORKING=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_LOOPBACK=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=8

# On QEMU targets NETWORKING=y defaults to SLIP over a UART pipe (it takes over
# the console UART) plus e1000. NET_SLIP_TAP is what selects SLIP/UART_PIPE;
# with no network drivers built, mlink0 is the only interface here.
CONFIG_NET_SLIP_TAP=n
CONFIG_NET_DRIVERS=n

# room for a TCP window's worth of 1500-byte packets in each direction
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=512
CONFIG_NET_BUF_TX_COUNT=512
