# P8.1 overrides for samples/drivers/virtualization/ivshmem/doorbell on qemu_x86_64:
# our ivshmem-server exports a 4 MiB region with 5 vectors (ABI v3), the stock
# board conf assumes 4 KiB / 2 vectors.
CONFIG_IVSHMEM_MSI_X_VECTORS=5
# the sample malloc()s a copy of the whole region
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4325376
# room to map the 4 MiB BAR2 plus the image
CONFIG_KERNEL_VM_SIZE=0x2000000
CONFIG_IVSHMEM_LOG_LEVEL_DBG=y
